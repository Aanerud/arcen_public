    "third_party/apple-cf-0.9.3-arcen1/ARCEN_*",
    "third_party/apple-cf-0.9.3-arcen1/arcen-*.patch",
    "third_party/videotoolbox-0.18.1-arcen1/ARCEN_*",
    "third_party/videotoolbox-0.18.1-arcen1/arcen-*.patch",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 TUTTIFRUTTI AS"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# opusic-sys and the Opus codec source it builds.
[[annotations]]
