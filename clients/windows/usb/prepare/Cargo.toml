[package]
name = "arcen-usb-prepare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Arcen USB component prepare tool for the Windows Deck (elevated once per tablet model)."

# Elevated: no UI, transport, media, GPU or async runtime crate.
[dependencies]
arcen-usb-bridge.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[lints]
workspace = true
