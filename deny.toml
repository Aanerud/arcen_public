[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Policy: every third-party licence must (1) combine one-way INTO
# AGPL-3.0-only, the licence of every first-party Arcen crate, and (2) let
# Arcen be distributed through app stores under the Arcen Store Distribution
# Exception (LICENSE-EXCEPTION.md). Permissive licences satisfy both. MPL-2.0
# qualifies via its section 3.3 and is file-level copyleft only.
#
# GPL, AGPL and LGPL are deliberately NOT allowed for third-party crates:
# their authors have not granted Arcen's store exception, so a copyleft
# dependency can make a store build of the artefact containing it
# non-distributable. A copyleft dependency must be flagged here, decided by
# Release/Security, and listed under [[licenses.exceptions]] with the reason;
# the publication pipeline reports every exception as a store blocker.
#
# First-party crates are `publish = false`, so `[licenses.private]` exempts
# them; that is why AGPL-3.0-only is no longer in the global allow list, where
# it would also have admitted third-party AGPL crates.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# libusb1-sys says MIT, but with the `vendored` feature (used by rusb in the
# macOS Deck's `native-tablet` feature and in arcen-usb-helper, which release
# Decks embed) it compiles and statically links libusb 1.0, which is
# LGPL-2.1-or-later. Without this clarification the LGPL code would be
# invisible to this check.
[[licenses.clarify]]
crate = "libusb1-sys"
expression = "MIT AND LGPL-2.1-or-later"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
