[package]
name = "arcen-capenc"
version = "0.21.4"
edition = "2021"
description = "Arcen capture+encode engine — NvFBC/DXGI/WGC -> NVENC (zero-copy). Emits Annex-B to stdout. Spawned by both Arcen Piers."
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "arcen_capenc"
path = "src/lib.rs"

[[bin]]
name = "arcen-capenc"
path = "src/main.rs"

[[bench]]
name = "keel_mf"
path = "benches/keel_mf.rs"
harness = false

[dependencies]
arcen-keel = { workspace = true }
arcen-media.workspace = true
arcen-outputs.workspace = true
arcen-protocol.workspace = true
arcen-telemetry.workspace = true
# Linux NvFBC/CUDA/NVENC entry points remain dlopen'd with hand-written FFI
# declarations; dlopen itself comes from glibc.

[target.'cfg(windows)'.dependencies]
# windows-rs: DXGI + D3D11. Feature-gated to keep the build lean.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",          # HMONITOR in DXGI_OUTPUT_DESC gates GetDesc
    # QueryDisplayConfig / DisplayConfigGetDeviceInfo: asks Windows whether an
    # output can carry Advanced Color at all, which is the question an HDR EDID
    # exists to change. Diagnostic only; see win_color_probe.rs.
    "Win32_Devices_Display",
    "Win32_System_Threading",
    "Win32_System_Power",          # SetThreadExecutionState — keep the display awake
    "Win32_System_LibraryLoader",  # LoadLibrary/GetProcAddress for nvEncodeAPI64.dll
    "Win32_System_StationsAndDesktops", # name the input desktop when duplication is refused
    "Win32_System_Diagnostics_ToolHelp", # which secure-desktop process holds input
    "Win32_System_RemoteDesktop",        # ProcessIdToSessionId
    # Windows.Graphics.Capture (WGC) — DWM-based capture that works on headless
    # NVIDIA vGPU / RDP where DXGI Desktop Duplication delivers no frames.
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # Media Foundation hardware encoder MFTs (`mf-hw`), and the D3D11 video
    # processor that converts captured BGRA to NV12 for them. Gated at module
    # level; the windows-crate feature list is additive.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "=0.13.2", default-features = false, features = ["damage", "randr", "shm"] }
# Wayland provider capture (feature `wayland`, default off): PipeWire stream
# consumer. MIT. Links libpipewire-0.3 and generates bindings with bindgen at
# build time (needs the PipeWire development headers and libclang). Only the
# PipeWire client library is linked; EGL and CUDA stay dlopen'd.
pipewire = { version = "=0.10.1", optional = true, default-features = false }
# Non-blocking canonical telemetry for the Wayland capture path.
arcen-observability = { workspace = true, optional = true }

# NVENC: we hand-roll a minimal FFI to nvEncodeAPI64.dll (loaded at runtime via
# windows-rs LoadLibrary/GetProcAddress) with vendored struct definitions. The
# crates (nvidia-video-codec-sdk -> cudarc) require nvcc/CUDA at build time and
# are CUDA-oriented; our DirectX NVENC path needs no CUDA at all, so raw FFI is
# both lighter and correct for a zero-dependency host agent.

[features]
# Guards the NVENC module so the capture-only skeleton still builds during
# incremental bring-up.
nvenc = []
# Media Foundation hardware encoder (Alpha): a GPU vendor's hardware encoder
# MFT (Intel Quick Sync, AMD AMF, any vendor that registers one) fed NV12
# textures from the DDA/WGC capture device. It shares the NVENC path's
# capture source selection, hence the `nvenc` dependency; nothing NVIDIA-only
# runs unless the session selects NVENC.
mf-hw = ["nvenc"]
# Portable OpenH264 path. The shared crate owns the safe wrapper and builds the
# codec from source; capenc never links a runtime-downloaded binary.
software-h264 = ["arcen-media/software-h264-source", "arcen-media/refine-zstd-encode"]
# Lossless refinement producer on the Xorg depth-30 path (ADR 0016): native
# libzstd for tile compression. The Linux Pier enables it by default; it runs
# only when the Pier passes `refine=on`.
lossless-refine = ["arcen-media/refine-zstd-encode"]
# Probe-only rav1e source used to measure the software AV1 ceiling. The
# product runtime does not select it until an interactive 4:2:0 path and
# software decode have both been proven.
software-av1 = ["arcen-media/software-av1-source"]
# Linux Wayland provider capture: bounded PipeWire buffer leases, host-copy
# upload into the CUDA/NVENC surface, and an unqualified DMA-BUF EGL/CUDA
# import. Default off; the Xorg NvFBC/XShm paths do not change with it. The
# portable lease, layout and hand-off logic compiles and is tested without it.
wayland = ["nvenc", "dep:pipewire", "dep:arcen-observability"]

[dev-dependencies]
criterion = { version = "0.6.0", default-features = false }
