[package]
name = "arcen-pier-windows"
version = "0.10.0"
edition = "2021"
description = "Arcen Pier (Windows) — native Rust QUIC host with LogonUser auth, WTS session attachment, SendInput injection, and DXGI/WGC->NVENC capture."
publish.workspace = true
license.workspace = true

[[bin]]
name = "arcen-pier"
path = "src/main.rs"

[features]
default = []
# Dormant source compatibility only. Release/package builds must not enable
# this feature; shipped Pier binaries expose QUIC exclusively.
wss-compat = [
    "arcen-protocol/wss-compat",
    "arcen-transport/wss-compat",
    "dep:tokio-rustls",
    "rustls/tls12",
    "tokio-rustls/tls12",
    "tokio-tungstenite/handshake",
]

[dependencies]
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
zip.workspace = true
arcen-protocol = { path = "../../shared/protocol", default-features = false }
arcen-media = { workspace = true, features = ["audio-opus"] }
arcen-input.workspace = true
arcen-iddcx-provider.workspace = true
arcen-session.workspace = true
arcen-identity.workspace = true
arcen-telemetry.workspace = true
arcen-observability.workspace = true
arcen-outputs.workspace = true
arcen-transport = { workspace = true, default-features = false, features = ["quic"] }
arcen-cp-ipc = { path = "cp-ipc" }
arcen-capenc = { path = "../capenc", features = ["nvenc", "software-h264"] }
getrandom.workspace = true
quinn.workspace = true
ring = "0.17"
zeroize = { version = "1", features = ["zeroize_derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tokio-tungstenite = { version = "0.24", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",                    # WASAPI loopback system-audio capture
    "Win32_Media_KernelStreaming",          # WAVEFORMATEXTENSIBLE PCM subtype
    "Win32_Media_Multimedia",               # IEEE float wave subtype
    "Win32_NetworkManagement_IpHelper",      # GetAdaptersAddresses network snapshots
    "Win32_NetworkManagement_Ndis",          # adapter records and operational status
    "Win32_Networking_WinSock",              # adapter address-family constants
    "Win32_Security",                       # LogonUserW
    "Win32_Security_Authorization",         # SDDL pipe ACL + ConvertSidToStringSidW (CP control pipe)
    "Win32_Storage_FileSystem",             # CreateFileW for the CP control pipe
    "Win32_System_IO",                      # OVERLAPPED for the CP pipe I/O
    "Win32_System_Com",                     # MMDevice/IAudioClient activation
    "Win32_System_Com_StructuredStorage",   # Audio endpoint PROPVARIANT values
    "Win32_System_Console",                 # service stdout/stderr redirection
    "Win32_System_DataExchange",            # user-session clipboard APIs
    "Win32_System_Environment",             # CreateEnvironmentBlock for user-session agent
    "Win32_System_EventLog",                # best-effort lifecycle event source + bounded query
    "Win32_System_JobObjects",              # kill-on-close per-connection agent lifecycle
    "Win32_System_LibraryLoader",           # System32-only dynamic NVAPI loading
    "Win32_System_Memory",                  # movable clipboard global memory
    "Win32_System_Pipes",                   # inherited anonymous broker/agent IPC
    "Win32_System_RemoteDesktop",           # WTS session enumeration and user tokens
    "Win32_System_Registry",                # HKLM MachineGuid diagnostics
    "Win32_System_Services",                # SCM service entry/status/control handling
    "Win32_System_SystemInformation",        # read-only OS version and uptime diagnostics
    "Wdk_System_SystemServices",             # RtlGetVersion read-only OS build diagnostics
    "Win32_System_Threading",
    "Win32_System_Time",                     # exact dynamic time-zone snapshot/apply
    "Win32_UI_Input_KeyboardAndMouse",      # SendInput, INPUT, KEYBDINPUT, MOUSEINPUT
    "Win32_UI_Input_Pointer",               # InjectSyntheticPointerInput, POINTER_INFO/POINTER_PEN_INFO
    "Win32_UI_Controls",                    # (Create|Destroy)SyntheticPointerDevice, POINTER_TYPE_INFO
    "Win32_UI_WindowsAndMessaging",         # GetSystemMetrics, PT_PEN, POINTER_FLAG_*/PEN_FLAG_*/PEN_MASK_*
    "Win32_UI_Shell_PropertiesSystem",      # Read-only endpoint property store
    "Win32_UI_Shell",                       # Known ProgramData folder resolution
    "Win32_UI_HiDpi",                       # SetProcessDpiAwarenessContext
    "Win32_Graphics_Gdi",                   # monitor metrics (Stage 4)
    "Win32_Graphics_Direct3D",              # host GPU capability probing
    "Win32_Graphics_Direct3D11",            # D3D11 feature/video-device probing
    "Win32_Globalization",                  # ordinal Unicode adapter-name matching
    "Win32_Devices_Display",                # Query/restore exact active display topology
    "Win32_Devices_FunctionDiscovery",      # Audio endpoint identity property key
    "Win32_Graphics_Dxgi",                  # selected output desktop rectangle
    "Win32_Graphics_Dxgi_Common",           # IDXGIOutput::GetDesc
] }

[build-dependencies]
quick-xml = "=0.37.5"

[dev-dependencies]
rcgen = "=0.14.8"
