# Arcen headless X server configuration
# Uses NVIDIA driver with fake connected monitor via CustomEDID
# Provides full GPU acceleration (GLX, MetaModes, OpenGL) without a physical display
#
# This is the same technique used by commercial remote-desktop software
# for running GPU-intensive applications headlessly.

Section "ServerLayout"
    Identifier     "Arcen"
    Screen      0  "Screen0"
    Option         "AllowEmptyInitialConfiguration" "true"
EndSection

Section "ServerFlags"
    Option         "DefaultServerLayout" "Arcen"
    Option         "AllowMouseOpenFail" "true"
    Option         "AutoAddDevices" "false"
    Option         "AutoEnableDevices" "false"
    Option         "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    BusID          "PCI:6:16:0"
    Option         "ConnectedMonitor" "DFP-0"
    Option         "AllowEmptyInitialConfiguration" "true"
    Option         "HardDPMS" "false"
    Option         "Interactive" "false"
    Option         "ModeValidation" "AllowNonEdidModes, NoEdidMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck, NoMaxSizeCheck"
    Option         "MetaModes" "DFP-0: nvidia-auto-select +0+0"
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    HorizSync      28.0-160.0
    VertRefresh    24.0-120.0
    # Default mode — can be overridden by xrandr at runtime
    Option         "PreferredMode" "1920x1200"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    # Thirty bits: ten per channel.
    #
    # This single number is what decides whether a Linux Pier can capture
    # more than eight bits per channel at all. X11 has no per-application
    # colour depth: XShmGetImage hands back the screen's own framebuffer
    # format, while Linux NvFBC is limited to eight-bit output formats even
    # when the screen is deeper. A ten-bit stream off a depth-24 server is
    # therefore eight-bit content in a wider container, and a depth-30 server
    # must use the separate XShm capture path.
    #
    # Depth 30 is ten bits per channel plus two unused bits in a 32-bit word.
    # Channel ordering is driver/visual-specific and must be read from the
    # root visual masks. Both the `Depth` inside the Display subsection and
    # `DefaultDepth` have to say 30 -- the subsection alone only offers the
    # depth, it does not select it.
    DefaultDepth   30
    Option         "AllowEmptyInitialConfiguration" "true"
    SubSection     "Display"
        Virtual    3840 2160
        Depth      30
    EndSubSection
EndSection

Section "Extensions"
    Option         "GLX" "Enable"
    Option         "RANDR" "Enable"
EndSection

Section "InputDevice"
    Identifier     "Keyboard0"
    Driver         "kbd"
EndSection

Section "InputDevice"
    Identifier     "Mouse0"
    Driver         "mouse"
    Option         "Protocol" "auto"
    Option         "Device" "/dev/input/mice"
    Option         "Emulate3Buttons" "no"
EndSection
