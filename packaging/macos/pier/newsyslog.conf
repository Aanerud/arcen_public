# Arcen Pier log rotation. Installed as /etc/newsyslog.d/pier.arcen.tech.conf.
#
# By size, compressed, kept for a few rotations. N: nothing to signal; the
# service reopens its log when it restarts.
#
# logfilename                                     [owner:group]  mode count size(KB) when flags
/Library/Logs/Arcen/Pier/service.log              _arcen:admin   640  5     10240    *    NJ
/Library/Logs/Arcen/Pier/arcen-pier-macos.jsonl   _arcen:admin   640  5     20480    *    NJ
