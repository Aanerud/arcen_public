[package]
name = "arcen-pier-windows-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "install-arcen-pier"
path = "src/main.rs"

[dependencies]
arcen-session.workspace = true
# `issuer`: the shared certificate issuer every Pier uses.
arcen-transport = { workspace = true, default-features = false, features = ["issuer"] }
serde_json.workspace = true
zeroize.workspace = true
# The clock the provisioning decision reads. Already in the graph through
# the shared issuer (rcgen).
time = "=0.3.47"

[target.'cfg(windows)'.dependencies]
# Creates the TLS directories and staged key files with their protected DACL
# in the creating call, reads directory owners and checks final paths.
windows-sys = { workspace = true, features = [
    # NtCreateFile relative to a held folder's handle: the walk from a volume
    # root to an install directory never looks a path up twice.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    # Starts the service and reads its state, checkpoint and wait hint
    # while it comes up.
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Builds the certificates earlier installers issued, for adoption tests.
rcgen = "=0.14.8"

[lints]
workspace = true
