[[difference]]
id = "PD-028"
area = "multi-monitor"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "What a Pier knows before authentication when it builds the multi-monitor offer. The policy is shared (arcen_outputs::admission::offer_max_monitors: carrier, operator switch, outputs, then the encoder; the least of capacity, operator ceiling and the protocol's four): the Linux Pier passes its resolved encoder and its head or proven virtual-output count, the Windows Pier its configured encoder (resolved per session) and no capacity, the macOS Pier its one native encoder and its concurrent-capture limit."
earned_by = "Windows builds the offer in session 0, which cannot see the interactive desktop's outputs or the adapter that owns them (WTS session isolation), so Auto is resolved per session (EncoderRequest::resolve_auto) and admission checks the probed inventory. macOS encodes every output with VideoToolbox. Linux knows its NVIDIA heads or qualified virtual outputs from configuration and resolves Auto before the offer."
code = [
  { path = "shared/outputs/src/admission.rs", symbol = "offer_max_monitors" },
  { path = "hosts/linux/src/session/multi_monitor.rs", symbol = "OfferEncoder::Resolved" },
  { path = "hosts/windows/src/multi_monitor_gate.rs", symbol = "OfferEncoder::PerSession" },
  { path = "hosts/macos/src/multi_monitor.rs", symbol = "OfferEncoder::Native" },
]

