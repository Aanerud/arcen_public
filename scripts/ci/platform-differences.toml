[[difference]]
id = "PD-041"
area = "keyboard"
products = ["hosts/macos"]
difference = "Keys the macOS Pier posts into its own session's lock screen come with the user activity a person's keys would have made (IOPMAssertionDeclareUserActivity, kIOPMUserActiveLocal): 250 ms after a Return or Enter pressed at the locked console, and, before a key pressed there while no password field holds Secure Event Input, once per 4 s, that key and everything after it then held 1.5 s in order and applied from the session loop's timer (shared arcen_input::keyboard::LockScreenActivity, InputHold). Keys on the desktop, and in its own password fields, are posted as before. The Linux and Windows Piers inject keys the system counts as a person's."
earned_by = "macOS 26.5 (lab Pier, 2026-11-22): once idle at the lock screen, loginwindow checks a submitted password only after the power manager reports the user active (IOPMScheduleUserActiveChangedNotification), which hardware input does and posted CGEvents do not: 'activity semaphore exists, waiting for user activity before continuing auth', then 'The user did not become active for authentication. Fail the auth' and 'INCORRECT password' for a password whose every key's code, flags, stored string and Shift flagsChanged a diagnostic build showed right. With the activity declared after the posted Return it logged 'user is active, releasing the activity semaphore' and 'Unlock succeeded, with password', the password typed slowly or at speed after a click on the field. A posted key into a hidden field shows it without focus ('showPasswordFieldMakingFirstResponder: 0') and the keys after it went nowhere. A virtual HID keyboard (the login window's) also unlocked, but its keys raced the lock screen's own wake animation; declared activity needs no device and leaves desk privacy's event filter unchanged."
code = [
  { path = "hosts/macos/src/input/mod.rs", symbol = "fn lock_screen_step" },
  { path = "hosts/macos/src/input/mod.rs", symbol = "fn declare_lock_screen_activity_after_submit" },
  { path = "hosts/macos/src/screen_lock.rs", symbol = "pub fn locked_on_console" },
  { path = "shared/input/src/keyboard/lock_screen.rs", symbol = "pub struct LockScreenActivity" },
]
decision = "hosts/macos/AGENTS.md"

[[difference]]
id = "PD-042"
area = "locale"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "Every Pier's session runs in the account's own language, never the Deck's: the Deck sends no locale. Only the Linux Pier decides that language itself, for a desktop it starts (shared `SessionLocale::resolve`: the account's AccountsService language and regional formats, else the system's `/etc/locale.conf`). A session the user already holds keeps the language its own sign-in gave it, on every Pier."
earned_by = "A Linux desktop the Pier starts has no display manager to set its locale, and PAM's `login` stack sets none, so without this it runs in the `C` locale. Windows (Winlogon loads the account's profile and display language) and macOS (loginwindow starts the Aqua session with the account's language preferences) always start the session through the operating system's own sign-in."
