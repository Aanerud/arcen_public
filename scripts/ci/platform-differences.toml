  { path = "shared/session/src/session_locale.rs", symbol = "pub struct SessionLocale" },
  { path = "hosts/linux/src/session/locale.rs", symbol = "pub fn session_locale" },
  { path = "hosts/linux/src/session/login_session.rs", symbol = "with_locale" },
]

[[difference]]
id = "PD-043"
area = "session model"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "A desktop another remote-desktop product owns. The Linux Pier joins another product's X11 desktop as a guest and, while that product has no client attached, lays the desktop's own outputs out to the Deck's monitors on attach, never scaled (modes of the Deck monitors' own sizes, added when an output lacks one, identity transforms), and leaves that layout when the Deck goes, as the product does (shared console_session::guest_layout; platform.session.guest_layout = keep shows it as it is). The Windows Pier lays out the console session's displays for the Deck and puts them back when it leaves (PD-032), whoever used the console before; the macOS Pier adds displays of its own (CGVirtualDisplay) and changes no display it did not create."
earned_by = "An X server another product started has only the heads its driver configured at start; NVIDIA adds no head to a running X server, so the Deck can only be given that server's own outputs, through a MetaMode (NV-CONTROL) and RandR modes, and the product lays the same outputs out again for its own client, so a layout put back would fight it. On Windows another product's client holds a session of its own; the account's own session is moved onto the console when the account signs in through Arcen (WTSConnectSessionW, which takes it from that client, as a sign-in at the desk does), and the Pier's display journal puts back the console's displays (SetDisplayConfig, NVAPI EDIDs). macOS gives the Deck displays of its own (CGVirtualDisplay), gone with the process that made them."
code = [
  { path = "hosts/linux/src/session/console_layout.rs", symbol = "plan_native_console_layout" },
  { path = "hosts/linux/src/session/launcher.rs", symbol = "guest_layout_policy" },
  { path = "shared/session/src/console_session/guest_layout.rs", symbol = "pub const fn guest_layout_policy" },
  { path = "hosts/windows/src/windows_session.rs", symbol = "fn console_refusal" },
  { path = "hosts/windows/src/console_recovery.rs", symbol = "SetTokenInformation" },
  { path = "hosts/macos/src/virtual_display.rs", symbol = "pub struct VirtualDisplay" },
]
decision = "docs/adr/0025-arcen-joins-the-users-session.md"

[[difference]]
id = "PD-044"
area = "displays"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "Every Pier proves that a Deck left its displays as they were with the shared `display_truth::restore_differences`, but each compares what its operating system reports and acts differently on a difference. Windows compares every connected target's place, mode, refresh, rotation, primary, EDID, Advanced Color mode, HDR switch and bit depth, and when a recovery journal cannot be applied sets it aside untouched, tells the Deck (`display_restore_pending`) and serves the session from the displays as they are. Linux (Xorg console) compares each RandR output's place, mode, refresh, rotation, primary, EDID and screen depth, and keeps an incomplete restore's journal as the record the next layout is restored to. macOS compares each display's place, mode, refresh, rotation, main display and EDR capability (no EDID, HDR switch or link depth), and puts a moved place back itself."
earned_by = "Windows DisplayConfig and the monitor registry report all of these and a journal replay can fail on a changed topology (`ambiguous all-path bindings`); Xorg composes SDR only and has no HDR switch, and an NVIDIA MetaMode is put back from the console's journal; CoreGraphics reports no EDID, HDR switch or link depth, macOS has no per-display HDR switch, and the Pier changes no physical display there, only adds virtual ones that leave with their process."
code = [
  { path = "shared/outputs/src/display_truth.rs", symbol = "pub fn restore_differences" },
  { path = "hosts/windows/src/display_truth.rs", symbol = "pub(crate) fn verify_restored" },
  { path = "hosts/linux/src/session/console_layout.rs", symbol = "fn read_truth" },
  { path = "hosts/macos/src/display_truth.rs", symbol = "pub struct RestoreCheck" },
]
decision = "docs/adr/0025-arcen-joins-the-users-session.md"

# --- Open gaps (unearned) -------------------------------------------------------

[[gap]]
id = "GAP-053"
area = "keyboard"
products = ["hosts/linux"]
difference = "On a Wayland session F13-F24 type what the compositor's keymap names them (stock xkeyboard-config: XF86Tools, XF86Launch5-9, XF86AudioMicMute, XF86Touchpad*); an Xorg session gets the keysyms F13-F24."
why_open = "Mutter's RemoteDesktop injects keycodes into the compositor's own keymap and its keysym call presses only keys that already carry the keysym; the xkb option fkeys:basic_13-24 (xkeyboard-config 2.43 and later) gives F13-F24 keysyms but is the user's input-source setting. Not proven on a live Wayland session yet."
