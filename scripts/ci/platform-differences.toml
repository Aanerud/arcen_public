[[gap]]
id = "GAP-038"
area = "TLS material"
products = ["hosts/linux", "hosts/windows", "hosts/macos", "packaging"]
difference = "Certificates are issued three ways: the openssl CLI (Linux Pier new-host-cert, Linux installer, new-host-cert.sh; SEC1 keys, CN \"Arcen Pier\", CA:FALSE, digitalSignature), rcgen in the macOS Pier (no key usage, no backdate) and rcgen in the Windows installer (digitalSignature, five-minute backdate); the journalled publish and recovery is written twice (macOS Pier, Linux installer)."
why_open = "Portable: the decision, file names, inspection and pin files are already shared (cert_provisioning, cert_store). One shared issuer needs to renew over the SEC1 keys deployed Linux Piers hold, which rcgen with ring cannot read; a SEC1-to-PKCS #8 wrap (tested in host_material) is the route."
owner = "Shared/Architecture"
code = [
  { path = "hosts/linux/src/host_cert.rs", symbol = "ecparam" },
  { path = "hosts/macos/src/host_cert.rs", symbol = "self_signed" },
  { path = "packaging/windows/installer/src/main.rs", symbol = "certificate_params" },
  { path = "packaging/linux/installer/src/main.rs", symbol = "recover_interrupted" },
]

[[gap]]
id = "GAP-039"
area = "TLS material"
products = ["hosts/macos"]
difference = "The macOS Pier reads its TLS material once at start: no reload and no certificate lifecycle events (active, expiring, expired, reloaded); Linux reloads on SIGHUP and Windows on its reload request, both emitting the shared events."
why_open = "Not implemented yet; HostTlsMaterial::reload and startup_event/status_events are shared and need only a trigger and an emitter."
owner = "macOS Host"
code = [
  { path = "hosts/macos/src/tls_material.rs", symbol = "HostTlsMaterial::load" },
  { path = "shared/transport/src/host_material.rs", symbol = "fn reload" },
]

[[gap]]
id = "GAP-040"
area = "support bundle"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "A Deck's support bundle can include its crash reports when asked (Settings checkbox, `--include-crash-dumps`); a Pier records the request as `crash_reports_not_collected` and includes none."
why_open = "Each OS keeps a Pier's crash reports where the Pier can read them (systemd-coredump, WER LocalDumps, DiagnosticReports); only that source adapter is OS-specific. The opt-in, the manifest record and the scrubbing are shared."
owner = "Shared/Architecture"
code = [{ path = "shared/observability/src/support_bundle.rs", symbol = "CrashReportsNotCollected" }]

[[gap]]
id = "GAP-041"
area = "session lifetime"
products = ["hosts/windows", "hosts/macos"]
difference = "Only the Linux Pier locks the session when a Deck leaves and hands the console back in the shared order (`console_session::DETACH_STEPS`); the Windows and macOS Piers never end the session but leave it unlocked (ADR 0025 audit)."
why_open = "Not implemented yet: the Windows agent needs LockWorkStation in the user's session at detach, the macOS agent the equivalent screen lock, each followed by the shared hand-back order."
owner = "Shared/Architecture"
code = [{ path = "shared/session/src/console_session/mod.rs", symbol = "DETACH_STEPS" }]

[[gap]]
id = "GAP-042"
area = "session model"
products = ["hosts/linux"]
difference = "The Linux Pier joins X11 console sessions only; a GNOME Wayland console session or login screen is refused `console_wayland_session` (ADR 0025 section 9)."
why_open = "Not implemented yet. Upstream has the route (Mutter ScreenCast and RemoteDesktop on the user's session bus, as GNOME Remote Desktop's desktop sharing uses; the greeter hook exists in GNOME Shell 40 and 49); Arcen's side (session-bus discovery, RecordMonitor capture of physical monitors, input through the session's RemoteDesktop session, the lock screen) is work package console-wayland."
owner = "Linux Host"
code = [{ path = "shared/session/src/console_session/mod.rs", symbol = "WaylandSession" }]

[[gap]]
id = "GAP-043"
area = "session model"
products = ["hosts/windows", "hosts/macos"]
difference = "Only the Linux Pier names, in the refusal a Deck shows, the other remote-desktop service that holds the workstation, as the host reports it at run time (`console_session::ForeignService`, `ConsoleNotice`); the Windows Pier refuses another account at the console without naming what drives it, the macOS Pier names the console owner only."
why_open = "Not implemented yet. Windows can read the console or remote session's WinStation name and protocol (`WTSQuerySessionInformationW`, already called in windows_session.rs) and the service owning the session's processes; macOS has no other-product console session model yet. Both would build the same shared ConsoleNotice."
owner = "Shared/Architecture"
code = [{ path = "shared/session/src/console_session/foreign_service.rs", symbol = "ConsoleNotice" }]

