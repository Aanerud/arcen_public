# --- Open gaps (unearned) -------------------------------------------------------

[[gap]]
id = "GAP-003"
area = "resume"
products = ["hosts/macos"]
difference = "The macOS Pier has no direct session resume (AUTH_METHOD_RESUME)."
why_open = "Not implemented yet; the Linux and Windows registries are copies of one another and are the candidate shared implementation."
owner = "macOS Host"
code = [
  { path = "hosts/linux/src/session/resume.rs", symbol = "AUTH_METHOD_RESUME" },
  { path = "hosts/windows/src/resume.rs", symbol = "AUTH_METHOD_RESUME" },
]

[[gap]]
id = "GAP-004"
area = "auth"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "Every handshake bound is shared (arcen_session::session_admission: HANDSHAKE_MESSAGE_TIMEOUT 15 s, AUTH_RESPONSE_TIMEOUT 60 s, CREDENTIAL_CHECK_TIMEOUT 30 s), but the shape differs: Linux and Windows bound each handshake message, the macOS Pier bounds the whole handshake as one wait (APPLICATION_HANDSHAKE_TIMEOUT, derived from the same constants)."
why_open = "The same budgets in two shapes; no OS reason. Closes with the shared negotiation core (P1)."
owner = "Shared/Architecture"
code = [
  { path = "shared/session/src/session_admission.rs", symbol = "APPLICATION_HANDSHAKE_TIMEOUT" },
  { path = "hosts/linux/src/net/server.rs", symbol = "HANDSHAKE_MESSAGE_TIMEOUT" },
  { path = "hosts/windows/src/session.rs", symbol = "HANDSHAKE_MESSAGE_TIMEOUT" },
  { path = "hosts/macos/src/session.rs", symbol = "APPLICATION_HANDSHAKE_TIMEOUT" },
]

