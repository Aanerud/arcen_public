# --- Local copies of shared constants and types ---------------------------------

[[local_copy]]
id = "local-modifier-constants"
pattern = '\bconst\s+MOD_(?:SHIFT|CTRL|ALT|META|KEYPAD)\b'
paths = ["hosts", "clients"]
shared = "arcen_protocol::keys::MOD_*"
known = []

[[local_copy]]
id = "local-auth-timeouts"
pattern = '\bconst\s+(?:PREAUTH_CAPACITY|PREAUTH_PER_SOURCE|RELAY_LIMIT_PER_SOURCE|AUTH_RESPONSE_TIMEOUT|INTERACTIVE_AUTH_RESPONSE_TIMEOUT|CLIENT_HELLO_TIMEOUT|QUALITY_SETTINGS_TIMEOUT|APPLICATION_HANDSHAKE_TIMEOUT|HANDSHAKE_RECEIVE_TIMEOUT|HANDSHAKE_MESSAGE_TIMEOUT|PAM_OPERATION_TIMEOUT|AUTH_VERIFY_TIMEOUT|CREDENTIAL_CHECK_TIMEOUT)\b|\bstruct\s+RelayCount\b'
paths = ["hosts"]
shared = "arcen_session::session_admission (PREAUTH_CAPACITY, PREAUTH_PER_SOURCE, PreauthAdmission, AUTH_RESPONSE_TIMEOUT, INTERACTIVE_AUTH_RESPONSE_TIMEOUT, HANDSHAKE_MESSAGE_TIMEOUT, APPLICATION_HANDSHAKE_TIMEOUT, CREDENTIAL_CHECK_TIMEOUT)"
known = []

[[local_copy]]
id = "local-tls-material"
pattern = '\bfn\s+(?:parse_material|load_validated|certificate_fields|emit_reload_failed|build_quic_server_config|marker_matches|legacy_arcen_evidence|write_pins)\b|\bstruct\s+(?:TlsFileSource|FileSnapshot|TlsPaths)\b|\benum\s+TlsLoadError\b|"sha256 Fingerprint='
paths = ["hosts", "packaging"]
shared = "arcen_transport::{host_material, cert_store, quic::pier_server_config}"
known = []

[[local_copy]]
id = "local-annexb-scan"
pattern = '\bfn\s+(?:find_start_code|scan_nals|avcc_to_annexb|parse_avc_decoder_config)\b'
paths = ["hosts", "clients"]
shared = "arcen_media::annexb"
known = []

[[local_copy]]
id = "local-offer-wrapper"
pattern = '\bfn\s+offer_wrapper\b'
paths = ["hosts"]
shared = "arcen_protocol AdvertisedMultiMonitorOffer::from_offer and arcen_outputs::admission::offer_max_monitors"
known = []

[[local_copy]]
id = "local-encoder-selection"
pattern = '\benum\s+EncoderSelection\b'
paths = ["hosts"]
shared = "arcen_media::EncoderRequest"
known = []

[[local_copy]]
id = "local-edid-builder"
pattern = '\bfn\s+(?:detailed_timing|encode_detailed_timing|cvt_reduced_blanking|write_range_descriptor|encode_range_descriptor|write_text_descriptor|encode_text_descriptor)\b|0x00,\s*0xff,\s*0xff,\s*0xff,\s*0xff,\s*0xff,\s*0xff,\s*0x00'
paths = ["hosts", "clients"]
shared = "arcen_outputs::edid (generate, generate_named, generate_hdr10)"
known = []

[[local_copy]]
id = "local-video-uniform"
pattern = '\bstruct\s+VideoUniform\b'
paths = ["clients", "hosts"]
shared = "arcen_media::video::present::VideoUniform"
known = []

[[local_copy]]
id = "local-clipboard-controller"
pattern = '\bstruct\s+ClipboardController\b'
paths = ["clients"]
shared = "arcen_deck_core::runtime::ClipboardController"
known = []

[[local_copy]]
id = "local-pq-references"
pattern = '\blet\s+m[12]\s*=\s*(?:2610|2523)\.0|\b1\.660_?491\b'
paths = ["clients", "hosts"]
shared = "arcen_media::video::{pq_signal_to_linear_nits, linear_nits_to_pq_signal, BT2020_TO_BT709, pq_bt2020_to_scrgb}"
known = []

