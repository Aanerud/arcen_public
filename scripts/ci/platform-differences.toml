[[difference]]
id = "PD-027"
area = "deskside privacy"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "How each Pier makes the desk private (desk privacy, on by default: privacy.desk), and which local devices the pinned deskside variants blank and grab, and how they are named."
earned_by = "Darkening: Linux sets every CRTC's RandR gamma ramp to zero (journalled, restored byte for byte) and grabs the seat's evdev devices (EVIOCGRAB); macOS gives each display an all-zero transfer table and runs an event tap; Windows cannot (GDI's SetDeviceGammaRamp silently refuses an all-black ramp, per its documentation), so it serves the session on a virtual display or a head with nothing connected, detaches every other monitor from the desktop with SetDisplayConfig under the display lease's recovery journal, proves no lit output has a monitor physically connected behind it (NVAPI display flags, software-enumerated indirect adapters), keeps proving it off the media path while the Deck is attached (the probe stalls capture on NVIDIA drivers, so the shared DeskWatch reads the CCD topology and NVAPI's cached connection state every second and runs the whole proof at once on a change, otherwise every 5 s) and blocks keyboard and mouse with low-level hooks. Naming: Linux pins evdev input devices and DRM outputs (with the firmware they run); Windows pins its monitors. macOS names neither: its window server shows an event filter who posted each event (kCGEventSourceUnixProcessID), never which device made it, so the macOS Pier drops every event its own process did not post, with nothing to pin; a virtual HID keyboard cannot be told from the desk's, so input_backend virtual_hid keeps a private desk's displays dark and reports its input live (and fails the configuration when privacy.desk is required). The policy is shared (arcen_session::deskside, arcen_session::console_session::desk_privacy)."
