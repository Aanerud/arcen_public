shared = "arcen_deck_core::runtime::ClipboardController"
known = []

[[local_copy]]
id = "local-pq-references"
pattern = '\blet\s+m[12]\s*=\s*(?:2610|2523)\.0|\b1\.660_?491\b'
paths = ["clients", "hosts"]
shared = "arcen_media::video::{pq_signal_to_linear_nits, linear_nits_to_pq_signal, BT2020_TO_BT709, pq_bt2020_to_scrgb}"
known = []

[[capability]]
id = "bundle_address_pseudonyms"
description = "Support bundles pseudonymise host names and addresses by one shared rule"
status = { "hosts/linux" = "present", "hosts/windows" = "present", "hosts/macos" = "present", "clients/macos" = "present", "clients/windows" = "present" }
proofs = { "hosts/linux" = 'collect_canonical_logs', "hosts/windows" = 'collect_canonical_logs', "hosts/macos" = 'collect_canonical_logs', "clients/macos" = 'pseudonymize_address', "clients/windows" = 'pseudonymize_address' }
paths = { "clients/macos" = ["shared/deck-core/src/support_bundle"], "clients/windows" = ["shared/deck-core/src/support_bundle"] }

[[capability]]
id = "bundle_crash_reports_opt_in"
description = "Crash reports enter a support bundle only when asked, and the manifest records the choice"
proof = 'crash_report_choice'
status = { "hosts/linux" = "present", "hosts/windows" = "present", "hosts/macos" = "present", "clients/macos" = "present", "clients/windows" = "present" }
paths = { "clients/macos" = ["shared/deck-core/src/support_bundle"], "clients/windows" = ["shared/deck-core/src/support_bundle"] }

[[capability]]
id = "bundle_crash_reports"
description = "A support bundle can include the product's own crash reports"
proof = 'CrashReportSource'
status = { "hosts/linux" = "GAP-040", "hosts/windows" = "GAP-040", "hosts/macos" = "GAP-040", "clients/macos" = "present", "clients/windows" = "present" }
paths = { "clients/macos" = ["shared/deck-core/src/support_bundle"], "clients/windows" = ["shared/deck-core/src/support_bundle"] }

[[capability]]
id = "lock_on_detach"
description = "Locks the user's session when a Deck leaves, then gives the desk its monitors and input back"
proof = 'DETACH_STEPS'
status = { "hosts/linux" = "present", "hosts/windows" = "GAP-041", "hosts/macos" = "GAP-041" }

[[capability]]
id = "names_conflicting_service"
description = "A refusal because another remote-desktop service holds the workstation names that service as the host reports it"
proof = 'ConsoleNotice'
status = { "hosts/linux" = "present", "hosts/windows" = "GAP-043", "hosts/macos" = "GAP-043" }
