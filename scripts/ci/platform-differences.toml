#
# The earned-differences ledger. Every difference between products (Piers,
# Decks) must be earned: an operating-system API or behaviour forces it.
# Anything else is an open gap to close or logic to move to shared/.
#
# Checked by scripts/check_shared_contracts.py (scripts/platform_differences.py)
# and rendered to docs/architecture/platform-differences.md
# (`scripts/check_shared_contracts.py --write-report`).
#
# [[difference]]  PD-NNN, an EARNED difference.
#   products    product directories it applies to
#   difference  what differs
#   earned_by   the named OS API or behaviour that forces it
#   code        citations {path, symbol}: the path must exist and, when a
#               symbol is given, show it in code (comments never count)
#   decision    optional ADR or document recording the decision
#   cfg_sites   OS-conditional cfg sites in shared/ it licenses,
#               {path, function, count}; every such site needs a row
#   config      packaged pier.json `platform` keys it explains,
#               "<product>:platform.<key>" (fnmatch); every key needs a row
# [[gap]]       GAP-NNN, an UNEARNED difference: work with an owner. Same
#               keys, with why_open and owner instead of earned_by/decision.
# [[capability]] parity matrix. `status` per product is "present" or the
#               PD/GAP id explaining its absence; the check proves "present"
#               with the `proof` regex (or `proofs` per product, searched in
#               `paths` per product when given) in production code, and fails
#               when a PD/GAP cell's proof matches.
# [[local_copy]] a local copy of a shared constant or type: `pattern` must
#               not match production code under `paths` outside `known`.

schema_version = 1

