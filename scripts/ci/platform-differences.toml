[[difference]]
id = "PD-032"
area = "display lifecycle"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "Only the Windows Pier records the pre-session windows, moves the windows a session stranded and replays a left-over display journal from a process it starts in the console session. The policy (when to restore, what to remove, which windows move) is shared: arcen_outputs::display_lease."
earned_by = "Windows: the Pier attaches to the console session (PD-002) and changes displays it did not create (CCD SetDisplayConfig isolation, NVAPI EDIDs); Windows does not move windows back onto a path that is re-activated, and SetDisplayConfig is refused in session 0. Linux: every output belongs to the private Xorg or headless Mutter the Pier owns (OutputSurface::DedicatedPhysical, RecordVirtual) and goes with it, together with its windows. macOS: CGVirtualDisplay objects belong to a child that exits when the Pier's pipe closes, and macOS moves windows off a display that departs; no display the Pier did not create is changed."
code = [
  { path = "hosts/windows/src/window_layout.rs", symbol = "plan_window_repatriation" },
  { path = "hosts/windows/src/console_recovery.rs", symbol = "SetTokenInformation" },
  { path = "hosts/linux/src/session/output_provider.rs", symbol = "DedicatedPhysical" },
  { path = "hosts/macos/src/virtual_display.rs", symbol = "read_line" },
