[[difference]]
id = "PD-038"
area = "Native tablet route"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "How a Pier brings a Deck's bridged tablet into the desktop. The route decision, the pen readers, the attachment, what a read pen claims and the Deck's wording are shared (arcen_usb_bridge::joined_pen::native_tablet_route, host_pen_bridge, arcen_input::bridged_pen). Linux publishes the tablet to its kernel through vhci-hcd for a dedicated Xorg desktop or a desktop on its own Arcen seat (the host driver route), and on a joined console reads the pen itself and posts it through its typed uinput pen (HidPublishPolicy::Nothing) once that device is proved to reach the joined X server alone. Windows always reads the pen itself (HidPublishPolicy::Nothing, Windows Ink). macOS reads the pen itself and publishes only pen and vendor interfaces (HidPublishPolicy::PenAndVendorOnly)."
earned_by = "Linux has an in-tree virtual USB host controller (vhci-hcd) and per-device udev/Xorg routing, but a joined console's X server is not one Arcen starts, so a raw bridged device cannot be confined to it (it ignores the arcen_bridge tag and has no per-desktop class); its typed uinput device is offered to every reader on seat0, so its readers are proved from /proc and logind's seat record. Windows has no virtual USB host controller or HID device without a kernel driver (ADR 0017). An IOHIDUserDevice on macOS is system-wide (ADR 0022)."
code = [
  { path = "hosts/linux/src/net/joined_pen.rs", symbol = "HidPublishPolicy::Nothing" },
  { path = "hosts/linux/src/input/joined_devices.rs", symbol = "listening_x_sockets" },
  { path = "hosts/linux/src/usb_bridge/mod.rs", symbol = "attach_x11_desktop" },
  { path = "hosts/windows/src/session.rs", symbol = "NATIVE_TABLET_POLICY" },
  { path = "hosts/macos/src/bridged_tablet.rs", symbol = "PUBLISH_POLICY" },
]
decision = "docs/architecture/pen-tablet-input.md"

[[difference]]
id = "PD-039"
area = "automatic cursor"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "Who draws the pointer under the automatic cursor, which every Deck asks for. The rule is shared (arcen_input::resolve_automatic_cursor_mode; the Deck hides its pointer whenever the result is Host, CursorModeResultMsg::host_draws_pointer): cursor images from the host mean the Deck draws; none mean the host draws the pointer into the video. The macOS Pier sends the desktop cursor's images, so it serves Local, when the Deck draws images and its agent can read the cursor at sign-in; otherwise it serves Host and turns on ScreenCaptureKit's showsCursor. The Linux and Windows Piers do not read the flag yet and serve the Deck's stored preference, Local with cursor images from their cursor watchers."
earned_by = "macOS gives the desktop pointer's image only through AppKit's deprecated NSCursor.currentSystemCursor, which answers only in a process with a window-server connection (an NSApplication in an Aqua session; without one it reads NULL, measured in hosts/macos/src/cursor_probe.rs), so the macOS Pier checks it live and keeps SCStreamConfiguration.showsCursor as the fallback. X11 (XFixes), Mutter's screencast cursor metadata and Windows (GetCursorInfo) give the image unconditionally."
code = [
  { path = "hosts/macos/src/session.rs", symbol = "fn host_sends_cursor_images" },
  { path = "hosts/macos/src/cursor_probe.rs", symbol = "fn desktop_cursor_images_readable" },
  { path = "hosts/linux/src/net/server.rs", symbol = "x11_cursor_watcher" },
  { path = "hosts/windows/src/cursor_watcher.rs", symbol = "deck_draws_images" },
]
decision = "docs/adr/0029-macos-pier-draws-the-pointer-into-the-video.md"

[[difference]]
id = "PD-040"
area = "keyboard"
products = ["hosts/macos"]
difference = "While Secure Event Input is held (a password field in a signed-in desktop; the lock screen's field is PD-041), the macOS Pier gives a key pressed with Shift alone the characters the session's layout types at its Shift level (CGEventKeyboardSetUnicodeString) when they differ from its unmodified ones, never the key after a dead key, from the keymap-watch notice and the shared PostedKeyText. The Linux and Windows Piers inject the key and the operating system translates it."
earned_by = "CGEventCreateKeyboardEvent stores the string the key code types with no modifier and CGEventSetFlags does not change it (Shift+C carries c, measured), and a field holding Secure Event Input reads that string instead of translating the key code and flags (Terminal with Secure Keyboard Entry read Shift+C as c, and reads AbC1xyZ9 exactly with the string; macOS 26.5). uinput, libei and SendInput keys carry no string."
