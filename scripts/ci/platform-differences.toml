]

[[gap]]
id = "GAP-050"
area = "deskside privacy"
products = ["hosts/windows"]
difference = "With desk privacy on (the default on every Pier), the Linux and macOS Piers make the desk dark before the session is shown (Linux blanks and grabs before GDM completes a remote sign-in; macOS before it serves the session); the Windows Pier detaches the desk's monitors from the desktop only once its session agent holds the display lease, so between a sign-in that unlocks or moves the session to the console and the detach (a few seconds) the desk's monitors show the session; and a desk whose session can only be shown on a monitor at the desk (no virtual display, the NVIDIA head is a desk monitor or a dummy plug, or another vendor's GPU NVAPI cannot describe) is served with its screens reported visible (best effort, since 0.21.3), or refused when privacy.desk is required, rather than darkened."
why_open = "Not implemented yet. Darkening a monitor is earned (GDI's SetDeviceGammaRamp silently refuses all-black ramps, per its Microsoft Learn documentation; DDC/CI power-off through VCP 0xD6 is optional per monitor, slow, and undone by the monitor's own power button; a black topmost window is drawn under the Start menu, notifications, the task switcher and the secure desktop), so the Windows Pier detaches the monitors (SetDisplayConfig under the display lease's recovery journal). Routes for the window: detach before the sign-in opens the session, as LocalSystem on the console's input desktop (the technique console_recovery already uses for restore-display --console); for the refused desks: prefer an NVIDIA head with nothing physically connected in nvapi_headless provisioning when desk privacy is on, or a supported virtual display. Proved on the lab vGPU guest only (a head reporting itself physically connected detached and restored after the Deck left and after the session agent was killed); not on a physical workstation. The GeForce-plus-virtual-display case (a negotiated display, deskside::virtual_output_instead_of, DisplayLease::detach_desk_monitors) is covered by unit tests only, not on a real PC."
owner = "Windows Host"
code = [
  { path = "hosts/windows/src/display.rs", symbol = "detach_desk_monitors" },
  { path = "hosts/windows/src/deskside.rs", symbol = "virtual_output_instead_of" },
  { path = "hosts/windows/src/deskside.rs", symbol = "prove_desk_dark" },
  { path = "shared/session/src/console_session/desk_privacy.rs", symbol = "desk_outputs_dark" },
]

[[gap]]
id = "GAP-051"
area = "deskside privacy"
products = ["hosts/windows"]
difference = "While a Deck is attached with desk privacy on, the Linux Pier blocks every input device a person at the desk can drive the desktop with (keyboards, mice, touchpads, tablets, touch screens: EVIOCGRAB) and the macOS Pier every event its own process did not post; the Windows Pier's low-level hooks (WH_KEYBOARD_LL, WH_MOUSE_LL) block the desk's keyboard and mouse only, so a pen tablet or touch screen at the desk still reaches the session through WM_POINTER."
why_open = "Not implemented yet. Low-level hooks do not see pointer (pen and touch) input on Windows; the routes considered are taking the desk's HID digitizers (disable or exclusive open while attached, re-enabled on detach and by the display watchdog's recovery) or a pointer-input redirection of the console session. Neither is built; the lab Windows Pier has no desk pen or touch screen to prove either on. Desk privacy's default proves the hook thread with the keyboard canary (InputHookGuard::install_keyboard_proved); blocking a physical desk mouse is unit-tested, not lab-proven (the lab Pier has no desk mouse). The mouse hook is given only the low 32 bits of an event's dwExtraInfo, so Arcen's injection markers are 32-bit: through 0.20.8 a 64-bit marker made the hook swallow every move, button and wheel a Deck sent (no pointer, no clicks), which an earlier note here misread as Windows never calling WH_MOUSE_LL for an injected move."
owner = "Windows Host"
code = [
  { path = "hosts/windows/src/deskside.rs", symbol = "InputHookGuard" },
  { path = "hosts/windows/src/input.rs", symbol = "InjectSyntheticPointerInput" },
]

[[gap]]
id = "GAP-042"
area = "session model"
products = ["hosts/linux"]
difference = "The Linux Pier joins the account's own GNOME Wayland console session (shared `console_session::wayland_join` and `wayland_attach`, Linux `session/wayland/join.rs`): its compositor proven, its own monitors recorded as they run, input and clipboard through its own RemoteDesktop session, served only when capture, input and lock are proved, locked when the Deck leaves. Unlike an X11 console it is not held for a resume (GNOME closes sharing on lock), a session shown on a monitor at the desk is served with its screens reported visible, or refused when desk privacy is required (`desk_privacy`: a Wayland desk cannot be blanked without changing the compositor), and a Wayland login screen is still refused `console_wayland_session` (ADR 0025 section 9)."
why_open = "The join has shipped: S4a (the target and ownership contract), S4c-2 (no desktop beside an account's session) and S4b (the join, its desk-privacy judgement, the lock on leaving or on a monitor change at the desk, and the join journal), proved on a task-owned GNOME 49 session without a display connector. Still missing: keeping a physical desk monitor private without changing the compositor; a remote-first sign-in through a Wayland login screen (GDM 47 has no third-party route; GDM 50 adds CreateUserDisplay, not used yet); the resume hold across a lock; persistent per-user Wayland sessions on a host without Xorg (`wayland-persistent-session`); laying the session's own monitors out to a Deck that matches its layout (Mutter's `org.gnome.Mutter.DisplayConfig.ApplyMonitorsConfig`, not used yet; ADR 0025 section 6); and native proof on a host with a display connector and GDM's login screen."
owner = "Linux Host"
code = [
  { path = "shared/session/src/console_session/wayland_attach.rs", symbol = "desk_privacy" },
  { path = "shared/session/src/console_session/wayland_attach.rs", symbol = "AFTER_DECK_LEFT" },
  { path = "hosts/linux/src/session/wayland/join.rs", symbol = "JoinedSession" },
]

