[[difference]]
id = "PD-018"
area = "file security"
products = ["hosts/windows", "clients/macos", "clients/windows", "shared/deck-core", "shared/observability"]
difference = "Private-file checks and creation modes."
earned_by = "POSIX mode bits, owner and O_NOFOLLOW on Unix; security descriptors, owners and reparse points on Windows, where files inherit an ACL instead of taking a mode. A file without a name while open (a sealed support bundle's plaintext) is unlink-while-open on Unix and FILE_FLAG_DELETE_ON_CLOSE on Windows, which cannot unlink an open file; FILE_FLAG_OPEN_REPARSE_POINT opens a reparse point instead of following it. A support-bundle source path is walked folder by folder: on Unix with openat(O_NOFOLLOW) relative to the folder before (rustix), following only a link whose owner and folder (uid, mode bits) show nobody else could have made it, and opening the file O_NONBLOCK so a FIFO cannot block; Win32 has no open relative to a handle and no owner/mode facts for a reparse point, so every folder is opened by path with FILE_FLAG_OPEN_REPARSE_POINT, any reparse point is refused, and each handle's GetFinalPathNameByHandleW location must sit inside the one before. Identity is fstat device and inode on Unix; on Windows the 64-bit volume serial and 128-bit FILE_ID_128 from GetFileInformationByHandleEx(FileIdInfo) (the 64-bit index only where FileIdInfo is unsupported), with GetVolumeInformationByHandleW's FILE_SUPPORTS_OPEN_BY_FILE_ID and FileRemoteProtocolInfo saying whether the volume can prove it (std exposes none of these on stable). The decisions (link_is_trusted, check_source, verify_same_source) are shared."
code = [
  { path = "clients/windows/src/platform/password_file.rs", symbol = "OWNER_SECURITY_INFORMATION" },
  { path = "hosts/windows/src/tls.rs", symbol = "FILE_ATTRIBUTE_REPARSE_POINT" },
  { path = "clients/macos/secure-dir/src/lib.rs" },
  { path = "shared/deck-core/src/config.rs", symbol = "PermissionsExt" },
  { path = "shared/observability/src/support_bundle.rs", symbol = "FILE_ATTRIBUTE_REPARSE_POINT" },
  { path = "shared/observability/src/support_bundle/seal.rs", symbol = "FILE_FLAG_DELETE_ON_CLOSE" },
  { path = "shared/observability/src/support_bundle/native_identity/unix.rs", symbol = "NOFOLLOW" },
  { path = "shared/observability/src/support_bundle/native_identity/windows.rs", symbol = "FILE_FLAG_OPEN_REPARSE_POINT" },
  { path = "shared/observability/src/support_bundle/native_identity/windows.rs", symbol = "GetFinalPathNameByHandleW" },
  { path = "shared/observability/src/support_bundle/native_identity/windows.rs", symbol = "FileIdInfo" },
  { path = "shared/observability/src/support_bundle/native_identity/windows.rs", symbol = "FILE_SUPPORTS_OPEN_BY_FILE_ID" },
  { path = "shared/observability/src/support_bundle/source.rs", symbol = "verify_same_source" },
  { path = "shared/observability/src/support_bundle/source.rs", symbol = "link_is_trusted" },
]
