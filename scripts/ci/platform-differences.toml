[[difference]]
id = "PD-032"
area = "display lifecycle"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "The Windows Pier records the pre-session windows, moves the windows a session stranded and replays a left-over display journal from a process it starts in the console session. The Linux Pier records a joined console's windows (EWMH) and moves back the ones the Deck's layout moved (plan_window_restore). The macOS Pier records none. The policy (when to restore, what to remove, which windows move) is shared: arcen_outputs::display_lease."
earned_by = "Windows: the Pier attaches to the console session (PD-002) and changes displays it did not create (CCD SetDisplayConfig isolation, NVAPI EDIDs); Windows does not move windows back onto a path that is re-activated, and SetDisplayConfig is refused in session 0. Linux, for a desktop the Pier creates (dedicated or headless Wayland): every output belongs to the private Xorg or headless Mutter the Pier owns (OutputSurface::DedicatedPhysical, RecordVirtual) and goes with it, together with its windows; a joined console's own monitors are laid out for the Deck and put back, so the windows the layout moved go back to their recorded places (console_windows, plan_window_restore; GNOME Shell 40 already returns a window to its monitor when that monitor comes back, measured 2026-11-18, and the Pier covers every EWMH window manager); the Windows Pier instead gathers the desktop onto displays it adds or activates, so it moves windows off those (plan_window_repatriation). macOS: CGVirtualDisplay objects belong to a child that exits when the Pier's pipe closes, and macOS moves windows off a display that departs; no display the Pier did not create is changed."
code = [
  { path = "hosts/windows/src/window_layout.rs", symbol = "plan_window_repatriation" },
  { path = "hosts/windows/src/console_recovery.rs", symbol = "SetTokenInformation" },
  { path = "hosts/linux/src/session/output_provider.rs", symbol = "DedicatedPhysical" },
  { path = "hosts/linux/src/session/console_windows.rs", symbol = "plan_window_restore" },
  { path = "hosts/macos/src/virtual_display.rs", symbol = "read_line" },
]
decision = "docs/architecture/display-lifecycle.md"

[[difference]]
