[[difference]]
id = "PD-002"
area = "session model"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "Every Pier joins the user's session (ADR 0025): the Linux Pier the user's GDM X11 session (remote-first through GDM's login screen), the Windows Pier the console session, the macOS Pier the logged-in Aqua session. On a Linux host without a display manager the Pier starts the account's real login session itself (PAM `arcen-login`, an X server on a seat0 virtual terminal, the user's X session entry) and joins it; only the Linux Pier can also create a per-connection desktop (`platform.session.mode` `dedicated`, an opt-in, or the headless Wayland provider). Where another remote-desktop product is the Linux host's display manager and keeps GDM's local login screen off, the Linux Pier starts the account's real login session with nobody signed in only when it proves the seat, the GPU and GDM free for it (GDM answering on the system bus for the session's lock screen and desk unlock, no X server, Arcen's login service installed, no client of the product connected; shared `LoginSessionProof`), refuses otherwise (`console_sign_in_other_product`), and never asks GDM for a login screen."
earned_by = "Linux: logind sessions, GDM's pre-authenticated greeter hook and PAM, and for a host without a display manager (no login screen exists) PAM and logind session creation with an Xorg or Wayland compositor spawn; GDM's `ShowLocalGreeter` setting (`[xdmcp]` with XDMCP on up to GDM 49, `[daemon]` from GDM 51) can switch its local login screen off, while GDM still unlocks a session it did not start (`OpenReauthenticationChannel`, a temporary channel); Windows and macOS always have the OS's own sign-in screen. Windows: one interactive console session (WTSConnectSessionW). macOS: one Aqua session per GUI user, owned by loginwindow."
code = [
  { path = "hosts/linux/src/session/console.rs", symbol = "sign_in_through_greeter" },
  { path = "hosts/linux/src/session/login_session.rs", symbol = "login_session_main" },
  { path = "hosts/linux/src/session/login_session.rs", symbol = "gdm_shows_local_login_screen_from" },
  { path = "hosts/linux/src/session/login_session.rs", symbol = "login_session_proof" },
  { path = "hosts/linux/src/session/launcher.rs", symbol = "DedicatedXorg" },
  { path = "hosts/windows/src/windows_session.rs", symbol = "WTSConnectSessionW" },
  { path = "hosts/macos/src/session.rs" },
]
config = [
  "hosts/linux:platform.session.mode",
  "hosts/linux:platform.session.desktop",
  "hosts/linux:platform.session.default_desktop",
  "hosts/linux:platform.session.display",
  "hosts/linux:platform.session.gpu_head",
  "hosts/linux:platform.session.xorg_bin",
  "hosts/linux:platform.session.xorg_config_template",
  "hosts/linux:platform.session.wayland_x11_apps",
  "hosts/linux:platform.session.runtime_root",
]

