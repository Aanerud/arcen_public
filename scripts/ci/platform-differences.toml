[[gap]]
id = "GAP-044"
area = "session lifetime"
products = ["hosts/windows"]
difference = "A session held for its Deck's resume is locked at once on both Piers. The Linux Pier unlocks it when the Deck resumes; the Windows Pier cannot, so a returning Deck that finds its session locked is asked to sign in again with its password (held_lock::HeldResume::SignInAgain), which unlocks the same session and takes the held desktop over."
why_open = "Not implemented yet. Windows unlocks a locked session only with the user's credential, and a resume carries none (held_lock::UnlockAuthority::OwnersPassword). Route to a password-free resume: take the held session off the console instead of locking it (WTSDisconnectSession; the desk sees the sign-in screen, which only the account's own password passes) and put it back at the resume as LocalSystem (WTSConnectSessionW, which the Pier already uses to move a parked session onto the console); it needs the held agent's capture and display lease to survive the console switch, and has to be qualified on hardware."
owner = "Windows Host"
