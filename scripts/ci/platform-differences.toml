[[difference]]
id = "PD-028"
area = "multi-monitor"
products = ["hosts/linux", "hosts/windows", "hosts/macos"]
difference = "What a Pier knows before authentication when it builds the multi-monitor offer. The policy is shared (arcen_outputs::admission::offer_max_monitors: carrier, operator switch, outputs, then the encoder; the least of capacity, operator ceiling and the protocol's four): the Linux Pier passes its resolved encoder and its head or proven virtual-output count, the Windows Pier its configured encoder (resolved per session) and no capacity, the macOS Pier its one native encoder and its concurrent-capture limit. A Pier that reads its outputs live before authentication (Windows) withholds the offer only for a topology it read and found empty, never for one it could not read (arcen_outputs::admission::preauth_outputs_verdict)."
earned_by = "Windows builds the offer in session 0, which cannot see the interactive desktop's outputs or the adapter that owns them (WTS session isolation), so Auto is resolved per session (EncoderRequest::resolve_auto) and admission checks the probed inventory; while Windows shows its sign-in or lock screen session 0 cannot read the topology at all (QueryDisplayConfig ERROR_ACCESS_DENIED), so the signed-in session reads the outputs and shows the layout on what it has. macOS encodes every output with VideoToolbox. Linux knows its NVIDIA heads or qualified virtual outputs from configuration and resolves Auto before the offer."
