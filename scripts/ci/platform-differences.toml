[[difference]]
id = "PD-033"
area = "session lifetime"
products = ["hosts/linux", "hosts/windows"]
difference = "When a Deck leaves, the Windows Pier gives the desk its outputs and input back before it locks the session (console_session::DETACH_STEPS_OUTPUTS_FIRST); the Linux Pier locks first (DETACH_STEPS). Under privacy.desk = \"required\", and for a session already locked, the Windows Pier locks first too (console_session::hand_back_order) and restores the displays behind the lock screen as LocalSystem on the console's input desktop. Both lock before the speakers come back, and neither ends the session."
