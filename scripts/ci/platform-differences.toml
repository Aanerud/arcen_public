[[gap]]
id = "GAP-052"
area = "Deck keyboard"
products = ["clients/macos"]
difference = "Both Decks have one keyboard switch, the same way (shared KeyboardCapture and KeyboardSwitchChord: Ctrl+Alt+Home or Control-Option-Home by default, a chord chosen in Settings > Input > Keyboard switch, a consumed click into the picture, the indicator and a notice on every flip). In Remote the Windows Deck takes the system shortcuts for the host by default; the macOS Deck takes Command+Tab, Command+Space, Mission Control and Control-Left/Right only with Settings > Input > Send Command-Tab, Command-Space and Mission Control on (offered once, in context, the first time Command+Tab leaves a session), which needs the Accessibility permission."
why_open = "The macOS event tap is built (an active CGEventTap installed only while the host has the keyboard and a session window is key, re-armed on kCGEventTapDisabledByTimeout, passing every event under Secure Event Input or aimed at another process; decisions in the shared MacTapRouter). Without the permission a Mac keeps Command+Tab and the other system chords; turning the tap on by default needs Release/Security approval of asking a Deck user for Accessibility (TCC wording in clients/macos/ENTITLEMENTS.md). Not yet proven with a real keyboard on a Mac Deck."
owner = "macOS Client"
code = [
  { path = "shared/input/src/keyboard/capture.rs", symbol = "KeyboardCapture" },
  { path = "shared/input/src/keyboard/mac_capture.rs", symbol = "MacTapRouter" },
  { path = "clients/macos/src/ui/system_shortcut_tap.rs", symbol = "CGEventTapCreate" },
  { path = "clients/windows/src/input/mod.rs", symbol = "toggle_keyboard" },
  { path = "shared/input/src/keyboard/switch_chord.rs", symbol = "KeyboardSwitchChord" },
]

