# What shared/ promises across products. Checked by
# scripts/check_shared_contracts.py (CI job "Shared contracts").
#
# Who consumes each shared crate, the product paths that use it, and the
# shared symbols each consumer must call from production code (not tests)
# live in shared/<crate>/consumers.json ("production_uses"), not here: a
# shared policy nobody calls is a proposal, not parity.
#
# [[forbid]]    a pattern marking a known duplicate or bypass of shared
#               policy; must not appear in production code under `paths`.
# [ratchet]     portable Rust under hosts/ (no OS API) may only shrink.

# --- Gates 1 and 4: installs that prove the Pier runs -----------------------

[[forbid]]
id = "ignored-install-step"
gate = 4
pattern = 'let\s+_\s*=\s*[A-Za-z_.]*transaction\s*\.\s*apply'
paths = ["hosts", "packaging"]
reason = "An ignored transaction step is the ceremony this gate removed; check the result."

# --- Gate 2: every host takes the Deck display's colour -----------------------

[[forbid]]
id = "colourless-edid"
gate = 2
pattern = 'EdidRequest\s*\{[^}]*?color:\s*None'
paths = ["hosts"]
justified_by_comment = true
reason = "A virtual display built for a Deck display carries that display's colour; say why none applies in a `// shared-contract colourless-edid: <reason>` comment."

# --- Gate 3: one video queue policy and one priority-audio lifecycle --------

[[forbid]]
id = "local-priority-audio"
gate = 3
pattern = 'struct\s+PriorityAudio\b'
paths = ["hosts"]
reason = "Use arcen_transport::quic::PriorityAudio instead of a host copy."

[[forbid]]
id = "local-keyframe-recovery"
gate = 3
pattern = 'awaiting_keyframe\s*:\s*bool'
paths = ["hosts"]
reason = "Keyframe-recovery state belongs to the shared video queue."

# --- Gate 7: presets are stated trade-offs ----------------------------------

[[forbid]]
id = "deck-preset-marketing-copy"
gate = 7
pattern = '"(?:30|60) fps,\s*adaptive|"[^"]*GPU-only capture'
paths = ["clients/macos"]
reason = "Deck preset copy must come from the shared preset contract and must not promise delivered fps or unique GPU capture behaviour."

# --- Ratchet ------------------------------------------------------------------

[ratchet]
baseline = "scripts/ci/portable-host-baseline.txt"
paths = ["hosts"]
minimum_lines = 40

# --- Gate 6: one adaptive bitrate controller, applied live everywhere --------

[[forbid]]
id = "zero-frame-wait-rate-sample"
gate = 6
pattern = 'mean_frame_wait:\s*Duration::ZERO'
paths = ["hosts/linux", "hosts/windows"]
reason = "Adaptive rate control must receive a real local backlog signal on split host queues."

[default_configs]
# One set of defaults on every host; the file is for turning things off.
files = [
  "packaging/linux/arcen-pier.json",
  "packaging/windows/pier.json",
  "packaging/macos/arcen-pier.json",
]
ignore = [
  "tls.cert",
  "tls.key",
  "auth.disclaimer.directory",
  "audio.local_playback",
]
