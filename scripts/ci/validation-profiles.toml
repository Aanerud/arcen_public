# The reviewed catalogue of build profiles and validations named by
# shared/*/consumers.json. Loaded only by scripts/check_shared_contracts.py.
#
# [template.<id>]          the only commands the checker will ever render or
#                          run: an argv list (no shell) whose placeholders are
#                          filled from catalogue values, never from a register.
#                          An empty argv means the result is recorded by a
#                          person or a lab and supplied as evidence.
# [build_profile.<id>]     a compiled variant: package, target OS, optional
#                          Rust target triple and Cargo features.
# [validation.<id>]        what must pass, on which target, with which
#                          features; kind is schema, unit, lint, build,
#                          evidence or hardware. Hardware validations are
#                          always recorded evidence.
#
# A register names validation IDs; it never carries commands or results.
# Results live in revision-bound evidence files (see
# docs/architecture/shared-consumers.md). Changing this file changes what a
# shared change must prove: it needs Release/Security and Shared/Architecture
# review.

schema_version = 1

# Run for every register, catalogue or documentation-only shared change.
registry_validation = "shared-consumer-registry"

# --- Templates -----------------------------------------------------------------

[template.cargo-test]
argv = ["cargo", "test", "--locked", "{target}", "-p", "{package}", "{features}"]

[template.cargo-build]
argv = ["cargo", "build", "--locked", "{target}", "-p", "{package}", "{features}"]

[template.cargo-clippy-strict]
argv = ["cargo", "clippy", "--locked", "{target}", "-p", "{package}", "{features}", "--", "-D", "warnings"]

[template.python-unittest]
argv = ["python3", "-m", "unittest", "{module}"]

[template.python-script]
argv = ["python3", "{script}"]

[template.bash-script]
argv = ["bash", "{script}"]

[template.recorded]
argv = []

