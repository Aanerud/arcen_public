[package]
name = "arcen-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
audio-opus = ["dep:opusic-c"]
software-h264-source = [
    "dep:openh264",
    "dep:openh264-sys2",
    "openh264/source",
    "openh264-sys2/source",
]
software-av1-source = ["dep:rav1e"]
# Lossless refinement codec adapters (ADR 0016). The portable core in
# `arcen_media::refine` needs neither. The encoder builds native libzstd
# (Piers only); the decoder is pure Rust (Decks).
refine-zstd-encode = ["dep:zstd"]
refine-zstd-decode = ["dep:ruzstd"]

[dependencies]
arcen-keel.workspace = true
arcen-protocol.workspace = true
arcen-telemetry.workspace = true
openh264 = { workspace = true, optional = true }
openh264-sys2 = { workspace = true, optional = true }
opusic-c = { workspace = true, optional = true }
png.workspace = true
rav1e = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
serde.workspace = true
xxhash-rust = { version = "0.8.17", default-features = false, features = ["xxh3"] }
zeroize.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "refine_verify"
required-features = ["refine-zstd-decode"]

[lints]
workspace = true
