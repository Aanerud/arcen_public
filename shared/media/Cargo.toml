[package]
name = "arcen-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
audio-opus = ["dep:opusic-c"]
software-h264-source = [
    "dep:openh264",
    "dep:openh264-sys2",
    "openh264/source",
    "openh264-sys2/source",
]
software-av1-source = ["dep:rav1e"]

[dependencies]
arcen-keel.workspace = true
arcen-protocol.workspace = true
arcen-telemetry.workspace = true
openh264 = { workspace = true, optional = true }
openh264-sys2 = { workspace = true, optional = true }
opusic-c = { workspace = true, optional = true }
png.workspace = true
rav1e = { workspace = true, optional = true }
serde.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
