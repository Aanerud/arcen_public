[package]
name = "arcen-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# The support-bundle collector every Pier and Deck writes with: the ZIP
# writer and SHA-256 hashing. Off by default so a program that only logs
# does not build an archive writer.
support-bundle = ["dep:sha2", "dep:zip"]

[dependencies]
arcen-protocol.workspace = true
arcen-telemetry.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
zip = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true
zip.workspace = true

[lints]
workspace = true
