[package]
name = "arcen-protocol"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Arcen wire protocol — the single source of truth for the on-wire contract shared by Arcen Pier (Linux/Windows) and Arcen Deck (macOS). Host-agnostic, serde-based."

[lib]
name = "arcen_protocol"
path = "src/lib.rs"

[features]
default = []
# Dormant source compatibility only. Product Deck/Pier builds must not enable
# this feature; shipped direct sessions are QUIC-only.
wss-compat = []

[dependencies]
arcen-usb-bridge.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
zeroize.workspace = true
