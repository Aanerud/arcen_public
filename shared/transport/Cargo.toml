[package]
name = "arcen-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# The shared certificate issuer (`cert_issuance::issue`): rcgen over ring,
# which rustls already builds. Off by default so a Deck or a program that
# only validates certificates links no issuer.
issuer = ["dep:rcgen", "dep:time"]
quic = [
    "dep:arcen-observability",
    "dep:bytes",
    "dep:futures-core",
    "dep:futures-sink",
    "dep:quinn",
    "dep:quinn-proto",
    "dep:tokio",
    "dep:tokio-util",
]

[dependencies]
arcen-identity.workspace = true
arcen-observability = { workspace = true, optional = true }
arcen-protocol = { workspace = true, default-features = false }
arcen-telemetry.workspace = true
bytes = { workspace = true, optional = true }
futures-core = { version = "0.3.33", optional = true }
futures-sink = { version = "0.3.33", optional = true }
quinn = { workspace = true, optional = true }
# Same crate and version quinn already builds; named only because quinn's
# congestion::Controller trait takes quinn_proto::RttEstimator, which quinn
# does not re-export (see quic/loss_guard.rs).
quinn-proto = { version = "=0.11.16", default-features = false, optional = true }
rcgen = { version = "=0.14.8", optional = true }
rustls.workspace = true
sha2.workspace = true
subtle.workspace = true
# rcgen's validity window is a time::OffsetDateTime; the version rcgen builds.
time = { version = "0.3.45", default-features = false, features = ["std"], optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen = "=0.14.8"
time = { version = "0.3.45", default-features = false, features = ["std"] }
serde_json.workspace = true
# Adds `tokio::time::pause`/`#[tokio::test(start_paused = true)]` for test
# code only (dev-dependencies are never linked into a non-test build of
# this crate or its dependents): used solely to prove the Carrier A
# `Notify`-based drain suspends rather than busy-polling while idle.
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "quic_multi_monitor_carrier_bench"
required-features = ["quic"]

[lints]
workspace = true
